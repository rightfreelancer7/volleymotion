<script>
  const IOS_URL =
    "https://apps.apple.com/app/id6806100721";

  const ANDROID_URL =
    "https://play.google.com/store/apps/details?id=com.its7.volleymotion";

  function redirectToStore() {
    const ua = navigator.userAgent || navigator.vendor || window.opera || "";

    const isAndroid = /android/i.test(ua);

    const isIOS =
      /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    if (isAndroid) {
      window.location.replace(ANDROID_URL);
      return;
    }

    if (isIOS) {
      window.location.replace(IOS_URL);
      return;
    }

    // Desktop / unknown device:
    // stay on webpage and show both buttons.
  }

  window.addEventListener("load", redirectToStore);
</script>
